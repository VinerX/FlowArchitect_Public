flow:
  id: s3_to_hdfs_ingestion
  name: S3 to HDFS Raw Data Ingestion
  description: Fetch files from S3 bucket raw-data, optionally decompress them, and
    store in HDFS /data/raw
triggers:
- id: trigger_schedule
  type: schedule
  condition: every hour
sources:
- id: source_s3
  name: Read from S3
  type: S3
  location: s3://raw-data
  connection:
    properties:
      access_key: '{{AWS_ACCESS_KEY}}'
      secret_key: '{{AWS_SECRET_KEY}}'
      region: '{{AWS_REGION}}'
processing_elements:
- id: process_uncompress
  name: Uncompress Files
  operation: Uncompress
  config:
    formats: zip, gzip
sinks:
- id: sink_hdfs
  name: Write to HDFS
  type: HDFS
  location: /data/raw
  connection:
    properties:
      namenode: '{{HDFS_NAMENODE}}'
      user: '{{HDFS_USER}}'
processed_data:
- id: raw_files
  format: binary
links:
- from_id: source_s3
  to_id: process_uncompress
  data_ref: raw_files
- from_id: process_uncompress
  to_id: sink_hdfs
  data_ref: raw_files