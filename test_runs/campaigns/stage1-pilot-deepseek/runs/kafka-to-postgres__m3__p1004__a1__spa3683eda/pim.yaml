flow:
  id: kafka_to_postgres
  name: Kafka to PostgreSQL
  description: Read JSON messages from Kafka topic orders, transform to table rows,
    and insert into PostgreSQL.
triggers:
- id: trigger_main
  type: schedule
  condition: every 1 minute
sources:
- id: source_kafka_orders
  name: Read Orders from Kafka
  type: Kafka
  location: orders
  connection:
    properties:
      brokers: '{{KAFKA_BROKERS}}'
      group_id: kafka_to_postgres_group
processing_elements:
- id: process_json_to_rows
  name: Convert JSON to Table Rows
  operation: json_to_rows
  config:
    schema: '{{TABLE_SCHEMA_MAPPING}}'
sinks:
- id: sink_postgres
  name: Write to PostgreSQL
  type: PostgreSQL
  location: '{{TABLE_NAME}}'
  connection:
    properties:
      host: '{{DB_HOST}}'
      port: '{{DB_PORT}}'
      database: '{{DATABASE_NAME}}'
      username: '{{DB_USERNAME}}'
      password: '{{DB_PASSWORD}}'
processed_data:
- id: orders_json
  format: json
- id: orders_table_rows
  format: table_rows
links:
- from_id: source_kafka_orders
  to_id: process_json_to_rows
  data_ref: orders_json
- from_id: process_json_to_rows
  to_id: sink_postgres
  data_ref: orders_table_rows