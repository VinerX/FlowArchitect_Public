campaign:
  id: stage1-pilot-qwen36-all-modes
  title: Этап 1 — pilot-валидация кейсов на Qwen 3.6 Plus
  owner: Дмитрий Макаров
  objective: 'Провести калибровочную серию на четырех базовых кейсах, чтобы проверить
    устойчивость режимов 0, 1, 2 и 3, удобство campaign runner и качество собираемых
    артефактов перед основной глобальной серией.

    '
  tags:
  - thesis
  - stage1
  - pilot
  - qwen36
defaults:
  presets:
  - 1000
  modes:
  - 0
  - 1
  - 2
  - 3
  stage_presets:
    pim: 1000
    corrector: 1003
  repeat: 1
  timeout_sec: 300
  nifi_validate: true
  manual_nifi_required: true
  requires_user_input: false
  stop_after_statuses:
  - needs_user_input
  - needs_nifi_manual_test
cases:
- id: currency-http-to-file
  title: Currency HTTP to File
  query: 'Получай курсы валют с https://api.exchangerate.host/latest и сохраняй результат
    в файл rates.json.

    '
  tags:
  - http
  - file
  - baseline
  expected_behavior: По расписанию обновляется файл rates.json с актуальными курсами.
  manual_test_checklist:
  - Импортировать полученный nifi.json в тестовый NiFi.
  - Проверить, что flow проходит валидацию без ошибок.
  - Проверить, что данные действительно сохраняются в файл.
- id: kafka-to-postgres
  title: Kafka to PostgreSQL
  query: 'Считывай сообщения из Kafka topic orders, преобразуй JSON в строки таблицы
    и записывай их в PostgreSQL.

    '
  tags:
  - kafka
  - postgres
  - streaming
  expected_behavior: Сообщения из Kafka появляются в таблице PostgreSQL после преобразования.
  manual_test_checklist:
  - Импортировать полученный nifi.json в тестовый NiFi.
  - Проверить наличие всех обязательных процессоров и соединений.
  - Проверить, что схема потока соответствует задаче Kafka -> PostgreSQL.
- id: postgres-to-kafka
  title: PostgreSQL to Kafka
  query: 'Периодически выбирай новые записи из PostgreSQL и публикуй их в Kafka topic
    analytics.events в формате JSON.

    '
  tags:
  - postgres
  - kafka
  - batch
  expected_behavior: Новые записи из PostgreSQL публикуются в Kafka topic analytics.events.
  manual_test_checklist:
  - Импортировать полученный nifi.json в тестовый NiFi.
  - Проверить наличие корректного источника чтения из PostgreSQL.
  - Проверить наличие корректной публикации в Kafka в формате JSON.
- id: s3-to-hdfs
  title: S3 to HDFS
  query: 'Забирай файлы из S3 бакета raw-data, при необходимости распаковывай их и
    складывай в HDFS в каталог /data/raw.

    '
  tags:
  - s3
  - hdfs
  - file-transfer
  expected_behavior: Файлы попадают из S3 в HDFS /data/raw с учетом шага распаковки
    при необходимости.
  manual_test_checklist:
  - Импортировать полученный nifi.json в тестовый NiFi.
  - Проверить, что поток отражает маршрут S3 -> optional unpack -> HDFS.
  - Проверить, что конфигурация не теряет целевой каталог /data/raw.
