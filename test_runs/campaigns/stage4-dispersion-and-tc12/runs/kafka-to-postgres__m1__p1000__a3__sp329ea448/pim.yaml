flow:
  id: kafka_orders_to_pg
  name: Kafka Orders to PostgreSQL
  description: Reads messages from orders.created topic, parses JSON, extracts specified
    fields, and inserts rows into public.orders table.
triggers:
- id: trigger_kafka_event
  type: event
  condition: on new message in orders.created
sources:
- id: source_kafka_orders
  name: Read Kafka Topic
  type: Kafka
  location: orders.created
  connection:
    properties:
      brokers: '{{KAFKA_BROKERS}}'
      group_id: '{{KAFKA_GROUP_ID}}'
processing_elements:
- id: process_extract_fields
  name: Parse and Extract Fields
  operation: Transform
  config:
    parse_json: true
    extract_fields:
    - order_id
    - user_id
    - amount
    - created_at
sinks:
- id: sink_postgres_orders
  name: Write to PostgreSQL
  type: PostgreSQL
  location: public.orders
  connection:
    properties:
      host: '{{DB_HOST}}'
      port: '{{DB_PORT}}'
      database: '{{DB_NAME}}'
      username: '{{DB_USERNAME}}'
      password: '{{DB_PASSWORD}}'
processed_data:
- id: order_records
  format: json
links:
- from_id: source_kafka_orders
  to_id: process_extract_fields
  data_ref: order_records
- from_id: process_extract_fields
  to_id: sink_postgres_orders
  data_ref: order_records