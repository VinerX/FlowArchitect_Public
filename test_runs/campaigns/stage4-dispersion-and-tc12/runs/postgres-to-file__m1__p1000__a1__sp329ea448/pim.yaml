flow:
  id: pg_to_json_export
  name: PostgreSQL to JSON Export
  description: Periodically export new records from PostgreSQL public.orders to a
    JSON file.
triggers:
- id: trigger_schedule
  type: schedule
  condition: every hour
sources:
- id: source_pg_orders
  name: Read PostgreSQL Orders
  type: PostgreSQL
  location: public.orders
  connection:
    properties:
      host: '{{DB_HOST}}'
      port: '{{DB_PORT}}'
      database: '{{DB_NAME}}'
      username: '{{DB_USERNAME}}'
      password: '{{DB_PASSWORD}}'
processing_elements:
- id: process_filter_new
  name: Select New Records
  operation: Query
  config:
    mode: incremental
    condition: updated_at > {{LAST_RUN_TIMESTAMP}}
sinks:
- id: sink_json_file
  name: Write to JSON File
  type: File
  location: /data/output/orders_export.json
processed_data:
- id: orders_json
  format: json
links:
- from_id: source_pg_orders
  to_id: process_filter_new
  data_ref: orders_json
- from_id: process_filter_new
  to_id: sink_json_file
  data_ref: orders_json