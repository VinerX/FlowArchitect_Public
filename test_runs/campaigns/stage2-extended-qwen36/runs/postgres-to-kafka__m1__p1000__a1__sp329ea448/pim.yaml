flow:
  id: pending_tx_to_kafka
  name: Pending Transactions to Kafka
  description: Extracts PENDING transactions from the database, converts them to JSON
    format, and publishes to a Kafka topic.
triggers:
- id: trigger_schedule
  type: schedule
  condition: every 5 minutes
sources:
- id: source_postgres
  name: Read Transactions
  type: PostgreSQL
  location: public.transactions
  connection:
    properties:
      host: '{{DB_HOST}}'
      port: '{{DB_PORT}}'
      database: '{{DB_NAME}}'
      username: '{{DB_USERNAME}}'
      password: '{{DB_PASSWORD}}'
processing_elements:
- id: process_filter_json
  name: Filter PENDING and Convert to JSON
  operation: Transform
  config:
    filter_condition: status == 'PENDING'
    output_format: json
sinks:
- id: sink_kafka
  name: Publish to Kafka
  type: Kafka
  location: transactions.overdue
  connection:
    properties:
      brokers: '{{KAFKA_BROKERS}}'
processed_data:
- id: pending_tx_json
  format: json
links:
- from_id: source_postgres
  to_id: process_filter_json
  data_ref: pending_tx_json
- from_id: process_filter_json
  to_id: sink_kafka
  data_ref: pending_tx_json