flow:
  id: s3_to_postgres_event_log
  name: S3 Raw Logs to PostgreSQL Event Log
  description: Hourly pipeline to read JSON files from S3, add processed_at timestamp,
    and load into PostgreSQL.
triggers:
- id: trigger_hourly
  type: schedule
  condition: every hour
sources:
- id: source_s3_raw_logs
  name: Read S3 Raw Logs
  type: S3
  location: raw-logs
  connection:
    properties:
      bucket: raw-logs
      region: '{{AWS_REGION}}'
      access_key_id: '{{AWS_ACCESS_KEY_ID}}'
      secret_access_key: '{{AWS_SECRET_ACCESS_KEY}}'
processing_elements:
- id: process_add_timestamp
  name: Add Processed At Timestamp
  operation: Transform
  config:
    action: add_field
    field_name: processed_at
    value: current_timestamp
sinks:
- id: sink_postgres_event_log
  name: Write to PostgreSQL Event Log
  type: PostgreSQL
  location: public.event_log
  connection:
    properties:
      host: '{{DB_HOST}}'
      port: '{{DB_PORT}}'
      database: '{{DATABASE_NAME}}'
      username: '{{DB_USERNAME}}'
      password: '{{DB_PASSWORD}}'
processed_data:
- id: event_log_json
  format: json
links:
- from_id: source_s3_raw_logs
  to_id: process_add_timestamp
  data_ref: event_log_json
- from_id: process_add_timestamp
  to_id: sink_postgres_event_log
  data_ref: event_log_json