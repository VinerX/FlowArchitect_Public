flow:
  id: pending_tx_to_kafka
  name: Pending Transactions to Kafka Pipeline
  description: Reads records with PENDING status from public.transactions, converts
    them to JSON, and publishes to the transactions.overdue Kafka topic
triggers:
- id: trigger_schedule
  type: schedule
  condition: every 15 minutes
sources:
- id: source_db
  name: Read Transactions Table
  type: PostgreSQL
  location: public.transactions
  connection:
    properties:
      host: '{{DB_HOST}}'
      port: '{{DB_PORT}}'
      database: '{{DB_NAME}}'
      username: '{{DB_USERNAME}}'
      password: '{{DB_PASSWORD}}'
processing_elements:
- id: process_filter
  name: Filter PENDING Status
  operation: Filter
  config:
    condition: status == 'PENDING'
- id: process_json
  name: Convert to JSON
  operation: Transform
  config:
    output_format: json
sinks:
- id: sink_kafka
  name: Publish to Kafka Topic
  type: Kafka
  location: transactions.overdue
  connection:
    properties:
      brokers: '{{KAFKA_BROKERS}}'
processed_data:
- id: tx_json_data
  format: json
links:
- from_id: source_db
  to_id: process_filter
  data_ref: tx_json_data
- from_id: process_filter
  to_id: process_json
  data_ref: tx_json_data
- from_id: process_json
  to_id: sink_kafka
  data_ref: tx_json_data