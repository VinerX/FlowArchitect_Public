flow:
  id: kafka_orders_to_postgres
  name: Kafka Orders to PostgreSQL Pipeline
  description: Reads messages from Kafka topic orders.created, parses JSON, extracts
    specific fields, and inserts them into PostgreSQL table public.orders.
triggers:
- id: trigger_event
  type: event
  condition: new message in topic orders.created
sources:
- id: source_kafka
  name: Read from Kafka
  type: Kafka
  location: orders.created
  connection:
    properties:
      brokers: '{{KAFKA_BROKERS}}'
      group_id: orders_consumer_group
processing_elements:
- id: process_parse_extract
  name: Parse JSON and Extract Fields
  operation: Transform
  config:
    format: json
    extract_fields:
    - order_id
    - user_id
    - amount
    - created_at
sinks:
- id: sink_postgres
  name: Write to PostgreSQL
  type: PostgreSQL
  location: public.orders
  connection:
    properties:
      host: '{{DB_HOST}}'
      port: '{{DB_PORT}}'
      database: '{{DATABASE_NAME}}'
      username: '{{DB_USERNAME}}'
      password: '{{DB_PASSWORD}}'
processed_data:
- id: orders_data
  format: json
links:
- from_id: source_kafka
  to_id: process_parse_extract
  data_ref: orders_data
- from_id: process_parse_extract
  to_id: sink_postgres
  data_ref: orders_data