flow:
  id: currency_rates_pipeline
  name: Fetch and Save Currency Rates
  description: Retrieves latest exchange rates from exchangerate.host and saves the
    response to rates.json
triggers:
- id: trigger_daily
  type: schedule
  condition: every 1 day
sources:
- id: source_api
  name: Fetch Exchange Rates
  type: HTTP
  location: https://api.exchangerate.host/latest
  connection:
    properties:
      method: GET
      accept_header: application/json
      timeout_seconds: '30'
processing_elements: []
sinks:
- id: sink_file
  name: Write to JSON File
  type: File
  location: rates.json
  connection:
    properties:
      path: '{{OUTPUT_DIR}}/rates.json'
      mode: overwrite
processed_data:
- id: rates_json
  format: json
links:
- from_id: source_api
  to_id: sink_file
  data_ref: rates_json