flow:
  id: s3_to_hdfs_ingestion
  name: S3 to HDFS File Ingestion
  description: Fetch files from S3 raw-data bucket, automatically decompress if needed,
    and store in HDFS /data/raw
triggers:
- id: trigger_schedule
  type: schedule
  condition: every 1 hour
sources:
- id: source_s3
  name: Read from S3
  type: S3
  location: raw-data
  connection:
    properties:
      aws_access_key_id: '{{AWS_ACCESS_KEY_ID}}'
      aws_secret_access_key: '{{AWS_SECRET_ACCESS_KEY}}'
      region: '{{AWS_REGION}}'
processing_elements:
- id: process_decompress
  name: Decompress Files
  operation: Decompress
  config:
    auto_detect_compression: true
    supported_formats:
    - gzip
    - zip
    - bzip2
sinks:
- id: sink_hdfs
  name: Write to HDFS
  type: HDFS
  location: /data/raw
  connection:
    properties:
      namenode_uri: '{{HDFS_NAMENODE_URI}}'
      username: '{{HDFS_USERNAME}}'
processed_data:
- id: raw_files
  format: raw
links:
- from_id: source_s3
  to_id: process_decompress
  data_ref: raw_files
- from_id: process_decompress
  to_id: sink_hdfs
  data_ref: raw_files