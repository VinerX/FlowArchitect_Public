flow:
  id: orders_ingestion
  name: Orders Kafka to PostgreSQL
  description: Read orders.created messages from Kafka, parse JSON, extract fields
    and insert into PostgreSQL
triggers:
- id: trigger_main
  type: schedule
  condition: every 1 minute
sources:
- id: source_kafka
  name: Read Orders from Kafka
  type: Kafka
  location: orders.created
  connection:
    properties:
      brokers: '{{KAFKA_BROKERS}}'
      group_id: orders_ingestion_group
      auto_offset_reset: earliest
processing_elements:
- id: process_parse
  name: Parse JSON and Extract Fields
  operation: ParseJSON
  config:
    fields: order_id,user_id,amount,created_at
sinks:
- id: sink_postgres
  name: Write to PostgreSQL
  type: PostgreSQL
  location: public.orders
  connection:
    properties:
      host: '{{DB_HOST}}'
      port: '{{DB_PORT}}'
      database: '{{DATABASE_NAME}}'
      username: '{{DB_USERNAME}}'
      password: '{{DB_PASSWORD}}'
processed_data:
- id: orders_data
  format: json
links:
- from_id: source_kafka
  to_id: process_parse
  data_ref: orders_data
- from_id: process_parse
  to_id: sink_postgres
  data_ref: orders_data