flow:
  id: orders_filter_pipeline
  name: Filter Completed Orders Pipeline
  description: Read CSV files from /data/input/orders/, filter rows where status=COMPLETED,
    write to /data/output/completed_orders.csv
triggers:
- id: trigger_main
  type: schedule
  condition: every 5 minutes
sources:
- id: source_csv
  name: Read Orders CSV
  type: CSV
  location: /data/input/orders/
  connection:
    properties:
      file_pattern: '*.csv'
- id: source_csv_single
  name: Read Single Output CSV
  type: CSV
  location: /data/output/completed_orders.csv
processing_elements:
- id: filter_completed
  name: Filter Completed Orders
  operation: Filter
  config:
    condition: status = 'COMPLETED'
sinks:
- id: sink_csv
  name: Write Completed Orders
  type: CSV
  location: /data/output/completed_orders.csv
processed_data:
- id: orders_data
  format: csv
links:
- from_id: source_csv
  to_id: filter_completed
  data_ref: orders_data
- from_id: filter_completed
  to_id: sink_csv
  data_ref: orders_data