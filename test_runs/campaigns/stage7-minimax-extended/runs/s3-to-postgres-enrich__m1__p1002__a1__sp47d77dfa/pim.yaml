flow:
  id: s3_to_postgres_event_log
  name: S3 JSON to PostgreSQL Event Log Pipeline
  description: Hourly ingestion of JSON files from S3 bucket raw-logs into PostgreSQL
    public.event_log table with processed_at timestamp
triggers:
- id: trigger_hourly
  type: schedule
  condition: every 1 hour
sources:
- id: source_s3
  name: Read JSON from S3
  type: S3
  location: raw-logs
  connection:
    properties:
      aws_access_key_id: '{{S3_AWS_ACCESS_KEY_ID}}'
      aws_secret_access_key: '{{S3_AWS_SECRET_ACCESS_KEY}}'
      region: '{{S3_REGION}}'
processing_elements:
- id: add_processed_at
  name: Add processed_at field
  operation: AddField
  config:
    field_name: processed_at
    field_value: '{{CURRENT_TIMESTAMP}}'
sinks:
- id: sink_postgres
  name: Write to PostgreSQL
  type: PostgreSQL
  location: public.event_log
  connection:
    properties:
      host: '{{DB_HOST}}'
      port: '{{DB_PORT}}'
      database: '{{DATABASE_NAME}}'
      username: '{{DB_USERNAME}}'
      password: '{{DB_PASSWORD}}'
processed_data:
- id: json_records
  format: json
links:
- from_id: source_s3
  to_id: add_processed_at
  data_ref: json_records
- from_id: add_processed_at
  to_id: sink_postgres
  data_ref: json_records