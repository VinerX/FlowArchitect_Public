flow:
  id: pending_transactions_to_kafka
  name: Pending Transactions to Kafka
  description: Read PENDING transactions from PostgreSQL, convert to JSON, and publish
    to Kafka topic transactions.overdue
triggers:
- id: trigger_main
  type: schedule
  condition: every 5 minutes
sources:
- id: source_postgres
  name: Read Transactions
  type: PostgreSQL
  location: public.transactions
  connection:
    properties:
      host: '{{DB_HOST}}'
      port: '{{DB_PORT}}'
      database: '{{DATABASE_NAME}}'
      username: '{{DB_USERNAME}}'
      password: '{{DB_PASSWORD}}'
processing_elements:
- id: process_filter
  name: Filter Pending Status
  operation: Filter
  config:
    condition: status = 'PENDING'
- id: process_convert
  name: Convert to JSON
  operation: Convert
  config:
    output_format: json
sinks:
- id: sink_kafka
  name: Publish to Kafka
  type: Kafka
  location: transactions.overdue
  connection:
    properties:
      brokers: '{{KAFKA_BROKERS}}'
processed_data:
- id: transactions_data
  format: json
links:
- from_id: source_postgres
  to_id: process_filter
  data_ref: transactions_data
- from_id: process_filter
  to_id: process_convert
  data_ref: transactions_data
- from_id: process_convert
  to_id: sink_kafka
  data_ref: transactions_data