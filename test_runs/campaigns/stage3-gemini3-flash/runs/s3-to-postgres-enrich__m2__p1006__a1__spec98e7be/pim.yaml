flow:
  id: s3_to_postgres_logs
  name: S3 Raw Logs to PostgreSQL
  description: Hourly ingestion of JSON logs from S3 to PostgreSQL with timestamp
    enrichment
triggers:
- id: hourly_trigger
  type: schedule
  condition: 0 * * * *
sources:
- id: s3_source
  name: S3 Raw Logs
  type: S3
  location: raw-logs
  connection:
    properties:
      bucket: raw-logs
      region: '{{S3_REGION}}'
      access_key: '{{S3_ACCESS_KEY}}'
      secret_key: '{{S3_SECRET_KEY}}'
processing_elements:
- id: add_timestamp
  name: Add processed_at field
  operation: Transform
  config:
    expression: 'data.map(record => ({...record, processed_at: new Date().toISOString()}))'
sinks:
- id: postgres_sink
  name: PostgreSQL Event Log
  type: PostgreSQL
  location: public.event_log
  connection:
    properties:
      host: '{{DB_HOST}}'
      port: '{{DB_PORT}}'
      database: '{{DB_NAME}}'
      username: '{{DB_USER}}'
      password: '{{DB_PASSWORD}}'
processed_data:
- id: log_data_json
  format: json
links:
- from_id: s3_source
  to_id: add_timestamp
  data_ref: log_data_json
- from_id: add_timestamp
  to_id: postgres_sink
  data_ref: log_data_json