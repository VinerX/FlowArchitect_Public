flow:
  id: s3_to_postgres_event_log
  name: S3 Raw Logs to PostgreSQL Event Log
  description: Every hour, read JSON files from S3 bucket raw-logs, enrich each record
    with processed_at timestamp, and load into public.event_log in PostgreSQL
triggers:
- id: trigger_hourly
  type: schedule
  condition: every 1 hour
sources:
- id: source_s3_raw_logs
  name: Read JSON Files from S3 raw-logs
  type: S3
  location: s3://raw-logs/
  connection:
    properties:
      bucket: raw-logs
      region: '{{AWS_REGION}}'
      access_key_id: '{{AWS_ACCESS_KEY_ID}}'
      secret_access_key: '{{AWS_SECRET_ACCESS_KEY}}'
      file_format: json
      path_prefix: '{{S3_PATH_PREFIX}}'
processing_elements:
- id: process_add_processed_at
  name: Add processed_at Field
  operation: FieldEnrichment
  config:
    add_fields:
      processed_at: current_timestamp()
sinks:
- id: sink_postgres_event_log
  name: Write to PostgreSQL public.event_log
  type: PostgreSQL
  location: public.event_log
  connection:
    properties:
      host: '{{DB_HOST}}'
      port: '{{DB_PORT}}'
      database: '{{DATABASE_NAME}}'
      username: '{{DB_USERNAME}}'
      password: '{{DB_PASSWORD}}'
      write_mode: append
processed_data:
- id: enriched_events_json
  format: json
links:
- from_id: source_s3_raw_logs
  to_id: process_add_processed_at
  data_ref: enriched_events_json
- from_id: process_add_processed_at
  to_id: sink_postgres_event_log
  data_ref: enriched_events_json