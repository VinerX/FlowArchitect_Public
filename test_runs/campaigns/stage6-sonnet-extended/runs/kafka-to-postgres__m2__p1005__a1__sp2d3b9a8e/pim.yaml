flow:
  id: kafka_orders_to_postgres
  name: Kafka Orders to PostgreSQL
  description: Считывает сообщения из Kafka topic orders.created, парсит JSON, извлекает
    поля order_id, user_id, amount, created_at и вставляет строки в таблицу public.orders
    в PostgreSQL
triggers:
- id: trigger_event
  type: event
  condition: New message in Kafka topic orders.created
sources:
- id: source_kafka_orders
  name: Kafka Topic orders.created
  type: Kafka
  location: orders.created
  connection:
    properties:
      brokers: '{{KAFKA_BROKERS}}'
      group_id: '{{KAFKA_CONSUMER_GROUP_ID}}'
      security_protocol: '{{KAFKA_SECURITY_PROTOCOL}}'
      auto_offset_reset: earliest
processing_elements:
- id: process_parse_json
  name: Parse JSON Message
  operation: Deserialize
  config:
    format: json
    input_field: value
- id: process_extract_fields
  name: Extract Fields
  operation: FieldExtraction
  config:
    fields:
    - order_id
    - user_id
    - amount
    - created_at
sinks:
- id: sink_postgres_orders
  name: PostgreSQL public.orders
  type: PostgreSQL
  location: public.orders
  connection:
    properties:
      host: '{{DB_HOST}}'
      port: '{{DB_PORT}}'
      database: '{{DB_NAME}}'
      username: '{{DB_USERNAME}}'
      password: '{{DB_PASSWORD}}'
processed_data:
- id: raw_kafka_message
  format: bytes
- id: parsed_order_json
  format: json
- id: extracted_order_fields
  format: record
links:
- from_id: source_kafka_orders
  to_id: process_parse_json
  data_ref: raw_kafka_message
- from_id: process_parse_json
  to_id: process_extract_fields
  data_ref: parsed_order_json
- from_id: process_extract_fields
  to_id: sink_postgres_orders
  data_ref: extracted_order_fields