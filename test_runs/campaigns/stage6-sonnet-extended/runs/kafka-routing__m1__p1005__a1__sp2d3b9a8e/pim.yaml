flow:
  id: events_routing_pipeline
  name: Events Routing Pipeline
  description: Read messages from Kafka topic events.all, route purchases to PostgreSQL
    purchases table, refunds to PostgreSQL refunds table, and everything else to Kafka
    topic events.unknown
triggers:
- id: trigger_main
  type: event
  condition: new message in Kafka topic events.all
sources:
- id: source_events_all
  name: Read from Kafka events.all
  type: Kafka
  location: events.all
  connection:
    properties:
      brokers: '{{KAFKA_BROKERS}}'
      group_id: '{{KAFKA_CONSUMER_GROUP_ID}}'
      auto_offset_reset: earliest
processing_elements:
- id: process_deserialize
  name: Deserialize Event Message
  operation: Deserialize
  config:
    format: json
    field_mapping: type, *
- id: process_route_purchase
  name: Filter Purchase Events
  operation: Filter
  config:
    condition: type == 'purchase'
- id: process_route_refund
  name: Filter Refund Events
  operation: Filter
  config:
    condition: type == 'refund'
- id: process_route_unknown
  name: Filter Unknown Events
  operation: Filter
  config:
    condition: type != 'purchase' AND type != 'refund'
sinks:
- id: sink_postgres_purchases
  name: Write to PostgreSQL purchases
  type: PostgreSQL
  location: public.purchases
  connection:
    properties:
      host: '{{DB_HOST}}'
      port: '{{DB_PORT}}'
      database: '{{DATABASE_NAME}}'
      username: '{{DB_USERNAME}}'
      password: '{{DB_PASSWORD}}'
- id: sink_postgres_refunds
  name: Write to PostgreSQL refunds
  type: PostgreSQL
  location: public.refunds
  connection:
    properties:
      host: '{{DB_HOST}}'
      port: '{{DB_PORT}}'
      database: '{{DATABASE_NAME}}'
      username: '{{DB_USERNAME}}'
      password: '{{DB_PASSWORD}}'
- id: sink_kafka_unknown
  name: Write to Kafka events.unknown
  type: Kafka
  location: events.unknown
  connection:
    properties:
      brokers: '{{KAFKA_BROKERS}}'
processed_data:
- id: event_raw
  format: json
- id: event_purchase
  format: json
- id: event_refund
  format: json
- id: event_unknown
  format: json
links:
- from_id: source_events_all
  to_id: process_deserialize
  data_ref: event_raw
- from_id: process_deserialize
  to_id: process_route_purchase
  data_ref: event_raw
- from_id: process_deserialize
  to_id: process_route_refund
  data_ref: event_raw
- from_id: process_deserialize
  to_id: process_route_unknown
  data_ref: event_raw
- from_id: process_route_purchase
  to_id: sink_postgres_purchases
  data_ref: event_purchase
- from_id: process_route_refund
  to_id: sink_postgres_refunds
  data_ref: event_refund
- from_id: process_route_unknown
  to_id: sink_kafka_unknown
  data_ref: event_unknown