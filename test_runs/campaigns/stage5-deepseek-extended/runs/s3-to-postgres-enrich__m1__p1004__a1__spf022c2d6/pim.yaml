flow:
  id: log_ingestion
  name: Log Ingestion Pipeline
  description: Fetch JSON logs from S3 bucket raw-logs every hour, add processed_at
    timestamp, load into PostgreSQL public.event_log
triggers:
- id: trigger_hourly
  type: schedule
  condition: 0 * * * *
sources:
- id: source_s3
  name: Read S3 Logs
  type: S3
  location: raw-logs
  connection:
    properties:
      region: '{{S3_REGION}}'
      access_key_id: '{{S3_ACCESS_KEY_ID}}'
      secret_access_key: '{{S3_SECRET_ACCESS_KEY}}'
processing_elements:
- id: add_processed_at
  name: Add Processed Timestamp
  operation: AddField
  config:
    field_name: processed_at
    value_expression: now()
sinks:
- id: sink_postgres
  name: Write to PostgreSQL
  type: PostgreSQL
  location: public.event_log
  connection:
    properties:
      host: '{{DB_HOST}}'
      port: '{{DB_PORT}}'
      database: '{{DATABASE_NAME}}'
      username: '{{DB_USERNAME}}'
      password: '{{DB_PASSWORD}}'
processed_data:
- id: json_data
  format: json
links:
- from_id: source_s3
  to_id: add_processed_at
  data_ref: json_data
- from_id: add_processed_at
  to_id: sink_postgres
  data_ref: json_data