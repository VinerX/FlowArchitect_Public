flow:
  id: pending_transactions_to_kafka
  name: Pending Transactions to Kafka
  description: Read pending transactions from PostgreSQL, filter status=PENDING, convert
    to JSON, publish to Kafka topic transactions.overdue
triggers:
- id: trigger1
  type: schedule
  condition: every 5 minutes
sources:
- id: source_pg
  name: Read from transactions
  type: PostgreSQL
  location: public.transactions
  connection:
    properties:
      host: '{{PG_HOST}}'
      port: '{{PG_PORT}}'
      database: '{{PG_DATABASE}}'
      username: '{{PG_USERNAME}}'
      password: '{{PG_PASSWORD}}'
processing_elements:
- id: filter_pending
  name: Filter PENDING
  operation: Filter
  config:
    condition: status = 'PENDING'
- id: convert_json
  name: Convert to JSON
  operation: Convert
  config:
    format: json
sinks:
- id: sink_kafka
  name: Publish to Kafka
  type: Kafka
  location: transactions.overdue
  connection:
    properties:
      brokers: '{{KAFKA_BROKERS}}'
processed_data:
- id: json_data
  format: json
links:
- from_id: source_pg
  to_id: filter_pending
  data_ref: raw_records
- from_id: filter_pending
  to_id: convert_json
  data_ref: filtered_records
- from_id: convert_json
  to_id: sink_kafka
  data_ref: json_data