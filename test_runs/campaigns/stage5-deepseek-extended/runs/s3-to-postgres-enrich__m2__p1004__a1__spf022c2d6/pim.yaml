flow:
  id: s3_to_postgres_event_log
  name: S3 to PostgreSQL Event Log Pipeline
  description: Hourly fetch JSON files from S3 bucket raw-logs, add processed_at timestamp,
    and load into public.event_log table in PostgreSQL.
triggers:
- id: trigger_hourly
  type: schedule
  condition: every 1 hour
sources:
- id: source_s3
  name: Read JSON from S3
  type: AWS S3
  location: s3://raw-logs
  connection:
    properties:
      aws_access_key_id: '{{AWS_ACCESS_KEY_ID}}'
      aws_secret_access_key: '{{AWS_SECRET_ACCESS_KEY}}'
      region: '{{AWS_REGION}}'
processing_elements:
- id: process_add_field
  name: Add processed_at field
  operation: AddField
  config:
    field_name: processed_at
    value_expression: current_timestamp
sinks:
- id: sink_postgres
  name: Write to PostgreSQL
  type: PostgreSQL
  location: public.event_log
  connection:
    properties:
      host: '{{DB_HOST}}'
      port: '{{DB_PORT}}'
      database: '{{DB_NAME}}'
      username: '{{DB_USER}}'
      password: '{{DB_PASSWORD}}'
processed_data:
- id: json_data
  format: json
links:
- from_id: source_s3
  to_id: process_add_field
  data_ref: json_data
- from_id: process_add_field
  to_id: sink_postgres
  data_ref: json_data