flow:
  id: transactions_overdue_pipeline
  name: Transactions Overdue Pipeline
  description: Reads PENDING transactions from PostgreSQL, converts to JSON, publishes
    to Kafka
triggers:
- id: trigger_schedule
  type: schedule
  condition: every 5 minutes
sources:
- id: source_postgres
  name: Read PENDING transactions
  type: PostgreSQL
  location: public.transactions
  connection:
    properties:
      host: '{{DB_HOST}}'
      port: '{{DB_PORT}}'
      database: '{{DATABASE_NAME}}'
      username: '{{DB_USERNAME}}'
      password: '{{DB_PASSWORD}}'
processing_elements:
- id: process_filter_convert
  name: Filter PENDING and convert to JSON
  operation: FilterAndConvert
  config:
    condition: status = 'PENDING'
    output_format: json
sinks:
- id: sink_kafka
  name: Publish to Kafka topic
  type: Kafka
  location: transactions.overdue
  connection:
    properties:
      brokers: '{{KAFKA_BROKERS}}'
      topic: transactions.overdue
processed_data:
- id: transactions_json
  format: json
links:
- from_id: source_postgres
  to_id: process_filter_convert
  data_ref: transactions_json
- from_id: process_filter_convert
  to_id: sink_kafka
  data_ref: transactions_json